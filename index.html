<html lang="en">
<head>
<meta charset="utf-8">

<title>Ask about Mattis</title>
<meta name="description" content="Chat with an on-device AI assistant about Mattis Fernandez, junior IT project manager. Runs locally in your browser on your GPU.">
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1b1f24; --muted: #5d6673; --border: #e2e5ea;
    --accent: #2457d6; --accent-text: #ffffff; --accent-soft: #e8eefc; --user: #2457d6; --user-text: #ffffff;
    --bot: #f0f2f5; --warn-bg: #fff6e0; --warn-text: #7a5300; --ok: #1f8a4c; --ok-soft: #e3f4ea;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1216; --panel: #171b21; --text: #e7eaee; --muted: #9aa3ae; --border: #2a3039;
      --accent: #6d97ff; --accent-text: #0b1020; --accent-soft: #1d2740; --user: #3a63d8; --user-text: #ffffff;
      --bot: #20262e; --warn-bg: #3a2f12; --warn-text: #f3d48a; --ok: #4cc283; --ok-soft: #173326; --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1216; --panel: #171b21; --text: #e7eaee; --muted: #9aa3ae; --border: #2a3039;
    --accent: #6d97ff; --accent-text: #0b1020; --accent-soft: #1d2740; --user: #3a63d8; --user-text: #ffffff;
    --bot: #20262e; --warn-bg: #3a2f12; --warn-text: #f3d48a; --ok: #4cc283; --ok-soft: #173326; --shadow: none;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .app { max-width: 860px; margin: 0 auto; height: 100%; display: flex; flex-direction: column; padding: 16px; gap: 12px; }
  .chat-ui { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; }
  header { display: flex; gap: 14px; align-items: center; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow); }
  .avatar { flex: none; width: 48px; height: 48px; border-radius: 50%; background: var(--accent); color: var(--accent-text); display: grid; place-items: center; font-weight: 700; font-size: 18px; }
  .who { min-width: 0; flex: 1; }
  .who h1 { margin: 0; font-size: 18px; }
  .who p { margin: 2px 0 0; color: var(--muted); font-size: 13.5px; }
  .who a { color: var(--accent); text-decoration: none; }
  .engine { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 12px 16px; box-shadow: var(--shadow); font-size: 13.5px; }
  .engine-row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.ok { background: var(--ok); }
  .dot.busy { background: var(--accent); animation: pulse 1s infinite alternate; }
  @keyframes pulse { to { opacity: .3; } }
  #engineText { flex: 1; min-width: 180px; color: var(--muted); }
  button, input { font: inherit; }
  button { cursor: pointer; border: 0; border-radius: 8px; padding: 7px 14px; background: var(--accent); color: var(--accent-text); font-weight: 600; }
  button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--border); }
  button:disabled { opacity: .5; cursor: default; }
  .bar { height: 6px; border-radius: 3px; background: var(--border); margin-top: 10px; overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .warn { margin-top: 10px; background: var(--warn-bg); color: var(--warn-text); border-radius: 8px; padding: 8px 10px; }
  main { flex: 1; min-height: 0; overflow-y: auto; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); }
  .msg { display: flex; margin: 0 0 12px; }
  .msg.user { justify-content: flex-end; }
  .bubble { max-width: 85%; padding: 10px 14px; border-radius: 14px; background: var(--bot); overflow-wrap: anywhere; }
  .msg.user .bubble { background: var(--user); color: var(--user-text); border-bottom-right-radius: 4px; }
  .msg.bot .bubble { border-bottom-left-radius: 4px; }
  .bubble p { margin: 0 0 8px; } .bubble p:last-child { margin-bottom: 0; }
  .bubble ul { margin: 4px 0 8px; padding-left: 20px; }
  .bubble a { color: var(--accent); }
  .msg.user .bubble a { color: inherit; }
  .tag { display: inline-block; font-size: 11.5px; color: var(--muted); margin-top: 6px; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .fade-in { animation: fadeIn .35s ease-out; }
  @media (prefers-reduced-motion: reduce) { .fade-in { animation: none; } }
  .cursor:empty::after, .cursor > p:last-child::after, .cursor > ul:last-child > li:last-child::after { content: "▍"; animation: pulse .6s infinite alternate; }
  .chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: thin; padding-bottom: 2px; }
  .chip { background: var(--accent-soft); color: var(--accent); border: 0; font-weight: 500; border-radius: 999px; padding: 6px 12px; font-size: 13.5px; white-space: nowrap; flex: none; }
  form { display: flex; gap: 8px; }
  textarea { flex: 1; min-width: 0; resize: none; font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; height: 46px; max-height: 140px; }
  textarea:focus, input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .chip.primary { background: var(--accent); color: var(--accent-text); font-weight: 600; }
  .chips-hint { flex: none; align-self: center; color: var(--muted); font-size: 13px; white-space: nowrap; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .btn { display: inline-block; text-decoration: none; border-radius: 8px; padding: 7px 14px; font-weight: 600; font-size: 14px; background: var(--accent); color: var(--accent-text) !important; border: 0; cursor: pointer; }
  .btn.ghost { background: transparent; color: var(--accent) !important; border: 1px solid var(--border); }
  .quote { border-left: 3px solid var(--accent); background: var(--panel); border-radius: 6px; padding: 8px 10px; margin: 8px 0 0; font-size: 14px; }
  #contactTop { flex: none; }
  footer { color: var(--muted); font-size: 12px; text-align: center; }
  footer a { color: inherit; }

  /* Onboarding steps */
  .wizard { flex: 1; min-height: 0; overflow-y: auto; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 20px; box-shadow: var(--shadow); }
  .wizard > * { max-width: 620px; margin-left: auto; margin-right: auto; }
  .wz-count { margin-top: 0; margin-bottom: 4px; color: var(--muted); font-size: 13px; font-weight: 600; }
  .wz-dots { display: flex; gap: 6px; margin-bottom: 14px; }
  .wz-dots span { height: 4px; flex: 1; border-radius: 2px; background: var(--border); }
  .wz-dots span.on { background: var(--accent); }
  .wizard h2 { font-size: 20px; margin: 0 0 6px; }
  .wizard .muted { color: var(--muted); margin: 0 0 12px; }
  .wizard .small { font-size: 13px; }
  .about { border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin: 0 0 18px; }
  .about h2 { margin-top: 0; }
  .about p { margin: 0 0 8px; }
  .about p:last-child { margin: 0; font-weight: 600; }
  .device { background: var(--bot); border-radius: 10px; padding: 8px 12px; font-size: 13.5px; margin: 0 0 14px; }
  .opts { display: grid; gap: 10px; }
  .opt { display: block; width: 100%; text-align: left; background: var(--panel); color: var(--text); border: 1.5px solid var(--border); border-radius: 12px; padding: 12px 14px; font-weight: 400; }
  .opt:hover { border-color: var(--accent); }
  .opt.selected { border-color: var(--accent); background: var(--accent-soft); }
  .opt-head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
  .opt-meta { color: var(--muted); font-size: 13px; }
  .opt-desc { display: block; margin-top: 4px; font-size: 14px; }
  .opt-meter { display: block; margin-top: 4px; color: var(--muted); font-size: 12.5px; }
  .opt-meter b { color: var(--accent); font-weight: 400; letter-spacing: 1px; }
  .badge { font-size: 11.5px; font-weight: 600; border-radius: 999px; padding: 2px 8px; background: var(--accent); color: var(--accent-text); }
  .badge.soft { background: var(--ok-soft); color: var(--ok); }
  .wz-warn { margin-top: 12px; background: var(--warn-bg); color: var(--warn-text); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
  .wz-dl { background: var(--bot); border-radius: 10px; padding: 10px 12px; margin: 0 0 16px; font-size: 13.5px; }
  .wz-dl p { margin: 0; color: var(--muted); }
  .wz-dl.ok p { color: var(--ok); font-weight: 600; }
  .wz-dl .bar { margin-top: 8px; }
  .langs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .langs .opt { text-align: center; font-size: 16px; font-weight: 600; padding: 16px; }
  .wz-label { font-weight: 600; margin: 16px 0 8px; }
  .wz-roles { display: flex; flex-wrap: wrap; gap: 8px; }
  .wz-roles .chip { border: 1.5px solid transparent; }
  .wz-roles .chip.selected { border-color: var(--accent); background: var(--accent); color: var(--accent-text); }
  .wz-other { width: 100%; margin-top: 10px; color: var(--text); background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; }
  .wz-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
  .wz-actions .ghost { margin-right: auto; }

  @media (max-width: 560px) {
    .app { padding: 10px 16px; }
    .bubble { max-width: 92%; }
    .who .place { display: none; }
    header { padding: 10px 12px; gap: 10px; }
    .avatar { width: 38px; height: 38px; font-size: 15px; }
    .who h1 { font-size: 16px; }
    #headline { display: none; }
    #contactTop { padding: 6px 10px; font-size: 13.5px; }
    .engine { padding: 10px 12px; font-size: 12.5px; }
    .warn { padding: 6px 8px; }
    .wizard { padding: 16px 14px; }
    .wizard h2 { font-size: 18px; }
  }
</style>

// Models offered. `id` gets the "-q4f16_1-MLC" or "-q4f32_1-MLC" suffix depending on GPU support.
// speed / quality are shown as 1-3 dots on the model cards.
const MODELS = [
  { base: "Qwen2.5-1.5B-Instruct", short: "Qwen2.5 1.5B", size: { en: "~1 GB", fr: "~1 Go" }, speed: 2, quality: 2 },
  { base: "Llama-3.2-3B-Instruct", short: "Llama 3.2 3B", size: { en: "~2 GB", fr: "~2 Go" }, speed: 1, quality: 3 },
  { base: "Llama-3.2-1B-Instruct", short: "Llama 3.2 1B", size: { en: "~0.7 GB", fr: "~0,7 Go" }, speed: 3, quality: 1 },
];
const DEFAULT_MODEL = 0, BIGGEST = 1, LIGHTEST = 2;

// Phones and low-memory devices: the browser kills the tab (and reloads the page) when the GPU runs out of memory,
// so they only get the lightest model with a smaller context window.
const IS_MOBILE = navigator.userAgentData?.mobile ?? /Android|iPhone|iPad|iPod|Mobi/i.test(navigator.userAgent);
const LOW_MEM = IS_MOBILE || (navigator.deviceMemory || 8) <= 4;
const OFFERED = LOW_MEM ? [LIGHTEST] : MODELS.map((_, i) => i);
const RECOMMENDED = LOW_MEM ? LIGHTEST : DEFAULT_MODEL;
const CHAT_OPTS = LOW_MEM ? { context_window_size: 2048 } : undefined;
// `words` is the length the model is asked to stay under; `maxTokens` is the hard cap (about 1.3 tokens per English word,
// more in French, plus margin).
const BUDGET = LOW_MEM ? { sections: 2, history: 2, words: 70, maxTokens: 160 } : { sections: 3, history: 6, words: 130, maxTokens: 300 };
const wordLimit = () => LANG === "fr" ? Math.round(BUDGET.words * 0.8) : BUDGET.words;

// Crash detection: a flag is set while the model loads or generates. If the page starts with the flag still set,
// the previous attempt killed the tab.
const BUSY_KEY = "aiBusy", CRASHED_KEY = "aiCrashed";
const markBusy = (stage, i) => store.set(BUSY_KEY, JSON.stringify({ stage, model: i, t: Date.now() }));
const clearBusy = () => store.del(BUSY_KEY);
function readCrash() {
  let v = null;
  try { v = JSON.parse(store.get(BUSY_KEY) || "null"); } catch {}
  store.del(BUSY_KEY);

Rules:

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function inline(s) {
  return esc(s)
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/(https?:\/\/[^\s<)]+[^\s<).,;:])/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
}
function render(md) {
  const out = []; let list = null;
  for (const raw of md.split("\n")) {
    const line = raw.trim();
    const m = line.match(/^(?:[-*•]|\d+[.)])\s+(.*)$/);
    if (m) { if (!list) { list = []; } list.push(`<li>${inline(m[1])}</li>`); continue; }
    if (list) { out.push(`<ul>${list.join("")}</ul>`); list = null; }
    if (line) out.push(`<p>${inline(line.replace(/^#+\s*/, ""))}</p>`);
  }
  if (list) out.push(`<ul>${list.join("")}</ul>`);
  return out.join("");
}
function addMsg(role, text, tag) {
  const wrap = document.createElement("div");
  wrap.className = `msg ${role}`;
  const b = document.createElement("div");
  b.className = "bubble";
  b.innerHTML = render(text);
  if (tag) b.insertAdjacentHTML("beforeend", `<span class="tag">${esc(tag)}</span>`);
  wrap.appendChild(b); chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
  return b;
}

function setChips(items, hint = "") {

const askChip = id => { const d = docs.find(x => x.id === id); return { label: d.ask, run: () => ask(d.ask) }; };
const contactChip = () => ({ label: t("contactChip"), primary: true, run: () => ask(t("contactQ")) });

function nextStep() {
  if (!lead.role && !lead.exploring) return setChips(roleChips(), t("hintRole"));
  const focus = lead.role ? lead.role.focus : ["strengths", "fayat", "why-pm", "availability"];
  const pool = [...focus, "why-pm", "strengths", "atinternet", "fayat-training", "languages", "education", "australia", "growth"];
  const picks = [...new Set(pool)].filter(id => !seen.has(id)).slice(0, 3).map(askChip);
  setChips(contactShown ? picks : [contactChip(), ...picks], t("hintNext"));
}

// Messages are shown one after the other: a saved answer is typed out word by word, like a generated one, and
// the next message waits for it.
let chain = Promise.resolve();
const queue = fn => (chain = chain.then(fn).catch(e => console.error(e)));
const REDUCED_MOTION = matchMedia("(prefers-reduced-motion: reduce)").matches;
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function typeOut(text, tag) {
  if (REDUCED_MOTION) return addMsg("bot", text, tag);
  const b = addMsg("bot", "");
  b.classList.add("cursor");
  const words = text.match(/\S+\s*/g) || [];
  const step = Math.max(1, Math.ceil(words.length / 90)); // about 30 words a second, 3 seconds at most
  await sleep(250);
  for (let n = step; n < words.length + step; n += step) {
    let part = words.slice(0, n).join("");
    if ((part.match(/\*\*/g) || []).length % 2) part += "**"; // close bold text cut in the middle
    b.innerHTML = render(part);
    chat.scrollTop = chat.scrollHeight;
    await sleep(30);
  }
  b.classList.remove("cursor");
  b.innerHTML = render(text) + (tag ? `<span class="tag">${esc(tag)}</span>` : "");
  chat.scrollTop = chat.scrollHeight;
  return b;
}
function botSay(text, tag) {
  history.push({ role: "assistant", content: text });
  return queue(() => typeOut(text, tag));
}
function userSay(text) {
  history.push({ role: "user", content: text });
  return queue(() => addMsg("user", text));
}

function chooseRole(r, typed = false) {
  if (busy) return;
  lead.role = r; lead.exploring = false;
  if (!typed) userSay(t("recruitingFor", { role: r.label }));
  botSay(r.custom ? F.customPitch.replace("{role}", r.label) : r.pitch);
  queue(nextStep);
}

// A position typed in the "Other" field: reuse a known role's pitch when it matches, otherwise a generic one.
function customRole(text) {
  const known = P.roles.find(r => r.match && r.match.test(text));
  return known ? { ...known, label: text } : { ...P.roles.find(r => r.id === "other"), label: text, custom: true };
}

// ---------- Engine ----------
let webllm = null, engine = null, engineState = "none"; // none | unsupported | idle | loading | ready | failed
let f16 = true, busy = false, current = null, progress = 0, loadError = "";
const device = { probed: false, gpu: false, reason: "" };
const modelId = i => `${MODELS[i].base}-${f16 ? "q4f16_1" : "q4f32_1"}-MLC`;
const savedModel = () => { const v = store.get("model"); return v === "quick" ? "quick" : v !== null && OFFERED.includes(+v) ? +v : null; };

async function probe() {
  if (!("gpu" in navigator)) device.reason = "noWebgpu";
  else {
    let adapter = null;
    try { adapter = await navigator.gpu.requestAdapter(); } catch {}
    if (!adapter) device.reason = "noAdapter";
    else { device.gpu = true; f16 = adapter.features.has("shader-f16"); }
  }
  device.probed = true;
  if (engineState === "none") engineState = device.gpu ? "idle" : "unsupported";
}

// Nothing is kept on the visitor's device: the model files are deleted from the browser cache as soon as the model
// is in memory, and leftovers from an earlier visit (an interrupted download, an older version of this page) are
// deleted when the page opens. Closing the tab then frees the memory and leaves nothing behind.
async function deleteStoredModels(ids = MODELS.flatMap(m => ["q4f16_1", "q4f32_1"].map(q => `${m.base}-${q}-MLC`))) {
  try {
    webllm ??= await import(WEBLLM_URL);
    for (const id of ids) { try { await webllm.deleteModelAllInfoInCache(id); } catch {} }
  } catch {}
  try { await caches.delete("transformers-cache"); } catch {}
}

function progressText() { return progress < 1 ? t("downloading", { p: Math.round(progress * 100) }) : t("preparing"); }

function refreshEngine() {
  const s = engineState, pref = savedModel();
  $("dot").className = "dot" + (s === "ready" ? " ok" : s === "loading" ? " busy" : "");
  $("engineText").textContent =
    s === "ready" ? t("engReady", { m: MODELS[current].short }) + (semState === "loading" ? t("semLoading") : semState === "ready" ? t("semReady") : "") :
    s === "loading" ? progressText() :
    s === "failed" ? t("engFail") :
    s === "unsupported" || pref === "quick" ? t("engQuick") : s === "none" ? t("checking") : t("engIdle");
  const bar = $("bar"); bar.hidden = s !== "loading"; bar.firstElementChild.style.width = `${Math.round(progress * 100)}%`;
  const start = $("startBtn");
  start.hidden = !(s === "idle" || s === "failed");
  if (typeof pref === "number") { start.textContent = s === "failed" ? t("retry") : t("startAi", { size: MODELS[pref].size[LANG] }); start.onclick = () => loadModel(pref); }
  else { start.textContent = t("useAi"); start.onclick = openSettings; }
  $("settingsBtn").hidden = !chatStarted || s === "unsupported";
  const w = $("warn");
  const msg = s === "unsupported" ? t(device.reason || "noWebgpu") : s === "failed" ? loadError : "";
  w.textContent = msg; w.hidden = !msg;
  fillDl();
}

async function loadModel(i) {
  if (engineState === "loading" || engineState === "ready" || !device.gpu) return;
  current = i; store.set("model", String(i));
  engineState = "loading"; progress = 0; loadError = "";
  refreshEngine();
  try {
    webllm ??= await import(WEBLLM_URL);
    markBusy("load", i);
    engine = await webllm.CreateMLCEngine(modelId(i), {
      initProgressCallback: r => { progress = Math.min(1, r.progress || 0); refreshEngine(); },
    }, CHAT_OPTS);
    clearBusy();
    engineState = "ready";
    deleteStoredModels([modelId(i)]);
    if (!LOW_MEM) startSemantic();
  } catch (e) {
    console.error(e);
    clearBusy();
    engineState = "failed"; loadError = String(e?.message || e).slice(0, 300);
  }
  refreshEngine();
}

// Search by meaning (computers only, once the AI model is ready): a small embedding model compares the question
// with each profile section and validated answer. Keyword search is used until it is ready, or if it fails.
let semState = "off"; // off | loading | ready | failed
let resolveChat; const chatReady = new Promise(r => { resolveChat = r; });
async function embedProfile() {
  const target = idx, jobs = target.embeddingJobs();
  const sv = await Semantic.embed(jobs.sections.map(x => x.text), "passage");
  const fv = await Semantic.embed(jobs.faq.map(x => x.text), "query");
  target.setVectors(sv, fv);
}
async function startSemantic() {
  if (semState !== "off" || !window.Semantic) return;
  semState = "loading"; refreshEngine();
  try {
    await Semantic.load();
    await chatReady; // the profile is built in the chosen language when the chat starts
    await embedProfile();
    semState = "ready";
  } catch (e) {
    console.error("Search by meaning unavailable:", e);
    semState = "failed";
  }
  refreshEngine();
}

// ---------- Onboarding steps ----------
// 1 = model, 2 = language (while the model downloads), 3 = position. Revisits only show step 3.
const wz = { steps: [], idx: 0, mode: "onboard", model: null, recruiting: null, role: null, other: "", crash: null, langAtOpen: null, modelAtOpen: null };

function fadeIn(el) { el.classList.remove("fade-in"); void el.offsetWidth; el.classList.add("fade-in"); }
function showWizard(steps, mode) {
  Object.assign(wz, { steps, mode, idx: 0, shown: null });
  wizard.hidden = false; $("chatUI").hidden = true;
  renderWizard();
}

const dots = n => `<b aria-label="${n}/3">${"●".repeat(n)}${"○".repeat(3 - n)}</b>`;

function stepModel() {
  let h = wz.mode === "settings" ? "" : `<div class="about"><h2>${esc(t("aboutTitle"))}</h2><p>${esc(t("aboutWhy"))}</p><p>${esc(t("aboutHow"))}</p><p>${esc(t("aboutPrivacy"))}${STATS ? " " + esc(t("statsNote")) : ""}</p></div>`;
  h += `<h2>${esc(t("s1Title"))}</h2>`;
  if (!device.probed) return h + `<p class="muted">${esc(t("checking"))}</p>`;
  h += `<p class="muted">${esc(t("s1Intro"))}</p>`;
  h += `<p class="device">${esc(device.gpu ? t(IS_MOBILE ? "devMobile" : LOW_MEM ? "devLowMem" : "devDesktop") : t(device.reason))}</p>`;
  if (wz.crash) h += `<div class="wz-warn" style="margin:0 0 14px">${esc(t(wz.crash.model === LIGHTEST || LOW_MEM ? "crashLight" : "crashHeavy"))}</div>`;
  const opts = device.gpu ? [...OFFERED, "quick"] : ["quick"];
  h += `<div class="opts">`;
  for (const o of opts) {
    const sel = wz.model === o, rec = o === (device.gpu ? RECOMMENDED : "quick");
    const badges = (rec ? `<span class="badge">${esc(t("recommended"))}</span>` : "") ;
    if (o === "quick") {
      h += `<button type="button" class="opt${sel ? " selected" : ""}" data-act="model" data-v="quick" aria-pressed="${sel}"><span class="opt-head"><strong>${esc(t("qName"))}</strong><span class="opt-meta">${esc(t("qMeta"))}</span>${badges}</span><span class="opt-desc">${esc(t("qDesc"))}</span></button>`;
    } else {
      const m = MODELS[o];
      h += `<button type="button" class="opt${sel ? " selected" : ""}" data-act="model" data-v="${o}" aria-pressed="${sel}"><span class="opt-head"><strong>${esc(t(`m${o}name`))}</strong><span class="opt-meta">${esc(m.short)} · ${esc(m.size[LANG])}</span>${badges}</span><span class="opt-desc">${esc(t(`m${o}desc`))}</span><span class="opt-meter">${esc(t("speed"))} ${dots(m.speed)} · ${esc(t("accuracy"))} ${dots(m.quality)}</span></button>`;
    }
  }
  h += `</div>`;
  const warn = wz.model === BIGGEST ? "warnBig" : wz.model === LIGHTEST ? "warnSmall" : wz.model === "quick" && device.gpu ? "warnQuick" : "";
  if (warn) h += `<div class="wz-warn">${esc(t(warn))}</div>`;
  const nextLabel = typeof wz.model === "number" && wz.mode !== "settings" ? t("downloadContinue") : t("next");
  h += `<div class="wz-actions">${wz.mode === "settings" ? `<button type="button" class="ghost" data-act="cancel">${esc(t("cancel"))}</button>` : ""}<button type="button" data-act="next"${wz.model === null ? " disabled" : ""}>${esc(nextLabel)}</button></div>`;
  return h;
}

function stepLang() {
  let h = `<h2>${esc(t("s2Title"))}</h2><div id="wzDl"></div><div class="langs">`;
  for (const [v, label] of [["en", "English"], ["fr", "Français"]]) {
    if (v === "fr" && !FR) continue;
    h += `<button type="button" class="opt${LANG === v ? " selected" : ""}" data-act="lang" data-v="${v}" lang="${v}" aria-pressed="${LANG === v}">${label}</button>`;
  }
  h += `</div>`;
  const last = wz.idx === wz.steps.length - 1;
  h += `<div class="wz-actions">${canGoBack() ? `<button type="button" class="ghost" data-act="back">${esc(t("back"))}</button>` : ""}<button type="button" data-act="next">${esc(last ? t("apply") : t("next"))}</button></div>`;
  return h;
}

function stepRole() {
  const roles = localize(LANG).roles.filter(r => r.id !== "other");
  let h = `<h2>${esc(t("s3Title"))}</h2><div id="wzDl"></div><div class="opts">`;
  for (const v of ["yes", "no"]) h += `<button type="button" class="opt${wz.recruiting === v ? " selected" : ""}" data-act="recruit" data-v="${v}" aria-pressed="${wz.recruiting === v}"><strong>${esc(t(v))}</strong></button>`;
  h += `</div>`;
  if (wz.recruiting === "yes") {
    h += `<p class="wz-label">${esc(t("whichRole"))}</p><div class="wz-roles">`;
    for (const r of roles) h += `<button type="button" class="chip${wz.role === r.id ? " selected" : ""}" data-act="role" data-v="${r.id}">${esc(r.label)}</button>`;
    h += `<button type="button" class="chip${wz.role === "other" ? " selected" : ""}" data-act="role" data-v="other">${esc(t("other"))}</button></div>`;
    if (wz.role === "other") h += `<input class="wz-other" id="wzOther" maxlength="80" placeholder="${esc(t("otherPh"))}" value="${esc(wz.other)}" aria-label="${esc(t("otherPh"))}">`;
  }
  h += `<div class="wz-actions">${canGoBack() ? `<button type="button" class="ghost" data-act="back">${esc(t("back"))}</button>` : ""}<button type="button" data-act="start"${roleReady() ? "" : " disabled"}>${esc(t("startChat"))}</button></div>`;
  return h;
}
const roleReady = () => wz.recruiting === "no" || (wz.recruiting === "yes" && wz.role && (wz.role !== "other" || wz.other.trim()));
// Going back to the model step is not possible once a download has started.
const canGoBack = () => wz.idx > 0 && !(wz.steps[wz.idx - 1] === 1 && wz.mode !== "settings" && (engineState === "loading" || engineState === "ready"));

function renderWizard() {
  const step = wz.steps[wz.idx];
  let h = "";
  if (wz.steps.length > 1) h += `<p class="wz-count">${esc(t("stepOf", { n: wz.idx + 1, total: wz.steps.length }))}</p><div class="wz-dots">${wz.steps.map((_, i) => `<span class="${i <= wz.idx ? "on" : ""}"></span>`).join("")}</div>`;
  // Fade in when the step changes, not when an option is picked on the same step.
  const fade = wz.shown !== `${wz.mode}:${wz.idx}:${step}` ? " fade-in" : "";
  wz.shown = `${wz.mode}:${wz.idx}:${step}`;
  h += `<div class="wz-body${fade}">${{ 1: stepModel, 2: stepLang, 3: stepRole }[step]()}</div>`;
  wizard.innerHTML = h;
  fillDl();
  const other = $("wzOther");
  if (other) other.oninput = () => { wz.other = other.value; wizard.querySelector('[data-act="start"]').disabled = !roleReady(); };
}

// Download progress shown inside steps 2 and 3, updated in place so typing in the "Other" field is not interrupted.
function fillDl() {
  const box = $("wzDl");
  if (!box) return;
  const s = engineState;
  if (s === "loading") {
    box.className = "wz-dl";
    box.innerHTML = `<p>${esc(progressText())}</p><div class="bar"><div style="width:${Math.round(progress * 100)}%"></div></div>${wz.steps[wz.idx] === 2 ? `<p class="small" style="margin-top:6px">${esc(t("s2Note"))}</p>` : ""}`;
  } else if (s === "ready") { box.className = "wz-dl ok"; box.innerHTML = `<p>✓ ${esc(t("modelReady"))}</p>`; }
  else if (s === "failed") { box.className = "wz-warn"; box.style.margin = "0 0 16px"; box.textContent = t("dlFail"); }
  else { box.className = ""; box.innerHTML = ""; }
}

wizard.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b || b.disabled) return;
  const v = b.dataset.v;
  switch (b.dataset.act) {
    case "model": wz.model = v === "quick" ? "quick" : +v; break;
    case "lang": LANG = v; applyTexts(); break;
    case "recruit": wz.recruiting = v; break;
    case "role": wz.role = v; break;
    case "back": wz.idx--; break;
    case "cancel": closeSettings(false); return;
    case "next": return wizardNext();
    case "start": return startChat();
  }
  renderWizard();
  if (b.dataset.act === "role" && v === "other") $("wzOther")?.focus();
});

function wizardNext() {
  const step = wz.steps[wz.idx];
  if (step === 1 && wz.mode !== "settings") {
    store.set("model", String(wz.model));
    if (typeof wz.model === "number") { store.del(CRASHED_KEY); loadModel(wz.model); }
  }
  if (step === 2) store.set("lang", LANG);
  if (wz.idx === wz.steps.length - 1) return closeSettings(true);
  wz.idx++;
  renderWizard();
}

function openSettings() {
  wz.langAtOpen = LANG; wz.modelAtOpen = savedModel();
  wz.model = engineState === "ready" ? current : savedModel() ?? (device.gpu ? RECOMMENDED : "quick");
  showWizard([1, 2], "settings");
}

// End of the settings steps. A different model replaces the one in memory; a new language restarts the conversation
// in that language (from the position step).
async function closeSettings(apply) {
  if (!apply) LANG = wz.langAtOpen;
  else {
    const m = wz.model, langChanged = LANG !== wz.langAtOpen;
    store.set("lang", LANG); store.set("model", String(m));
    if (engineState === "loading" && m !== current) {
      // A download is in progress: start again cleanly with the new choice.
      if (typeof m === "number") { session.set("loadNow", "1"); store.del(CRASHED_KEY); }
      location.reload();
      return;
    }
    if (engineState === "ready" && m !== current) {
      try { await engine.unload(); } catch {}
      engine = null; engineState = "idle";
    }
    if (typeof m === "number" && engineState !== "ready" && engineState !== "loading") { store.del(CRASHED_KEY); loadModel(m); }
    if (langChanged) return restartChat();
  }
  applyTexts();
  wizard.hidden = true; $("chatUI").hidden = false; fadeIn($("chatUI"));
  refreshEngine();
}

function restartChat() {
  chatStarted = false;
  chat.innerHTML = ""; $("chips").innerHTML = "";
  history.length = 0; seen.clear();
  Object.assign(lead, { role: null, exploring: false });
  answers = 0; ctaShown = false; contactShown = false;
  Object.assign(wz, { recruiting: null, role: null, other: "" });
  applyTexts();
  showWizard([3], "role");
}

function startChat() {
  if (chatStarted) return;
  chatStarted = true;
  resolveChat();
  store.set("lang", LANG);
  buildContent(); applyTexts();
  if (semState === "ready") embedProfile().catch(e => console.error(e)); // after a language change
  wizard.hidden = true; $("chatUI").hidden = false; fadeIn($("chatUI"));
  botSay(F.welcome);
  if (wz.recruiting === "yes" && roleReady()) {
    chooseRole(wz.role === "other" ? customRole(wz.other.trim()) : P.roles.find(r => r.id === wz.role));
  } else if (wz.recruiting === "no") {
    lead.exploring = true;
    userSay(t("exploring"));
    botSay(F.explore);
    queue(nextStep);
  } else queue(nextStep);
  refreshEngine();
  if (!IS_MOBILE) input.focus();
}

// ---------- Answering ----------
function trimToSentence(text) {
  const end = Math.max(...[...text.matchAll(/[.!?](?=\s|$)/g)].map(m => m.index));
  return end > text.length * 0.4 ? text.slice(0, end + 1) : text.trimEnd() + "…";
}

const DEBUG = new URLSearchParams(location.search).has("debug"); // ?debug in the address shows how each answer was found
const tagText = (base, extra) => base + (DEBUG && extra ? ` · ${extra}` : "");

// Embedding of the question once the semantic search is ready; null otherwise (keyword search is used then).
async function queryVector(q) {
  if (!idx.hasVectors()) return null;
  try { return (await Semantic.embed([q], "query"))[0]; } catch (e) { console.error(e); return null; }
}

function quickAnswer(q, qVec) {
  if (isPitch(q)) return P.core;
  const [top, ...rest] = retrieve(q, 3, qVec);
  let a = `**${top.title}**\n${top.text}`;
  if (rest.length) a += `\n\n${t("related")}${LANG === "fr" ? " : " : ": "}${rest.map(d => d.title).join(" · ")}`;
  return a;
}

async function ask(q) {
  q = q.trim();
  if (!q || busy || !chatStarted) return;
  input.value = ""; autosize();
  busy = true; await chain; busy = false; // let the previous message finish typing
  await userSay(q);

  // Recruiter states the role they are hiring for.
  if (!lead.role) {
    const r = P.roles.find(r => r.match && r.match.test(q));
    if (r && (ROLE_STATEMENT.test(q) || q.split(/\s+/).length <= 4) && !q.includes("?")) return chooseRole(r, true);
    if (r) lead.role = r;
  }

  // Conversion: contact requests always get the contact card, whatever the mode.
  if (CONTACT_INTENT[LANG].test(q) && !NOT_CONTACT.test(q)) { showContact(); nextStep(); return; }

  answers++;
  busy = true; sendBtn.disabled = true;
  const qVec = await queryVector(q);
  const faq = idx.findFaq(q, qVec);
  if (faq) {
    // A validated answer: shown word for word, no AI involved.
    seen.add(faq.item.section);
    await botSay(faq.item.a, tagText(t("validated"), `${faq.item.id} ${faq.score.toFixed(3)} (${faq.how})`));
  } else {
    const hits = retrieve(q, 3, qVec);
    seen.add(hits[0].id);
    if (engineState !== "ready") {
      const tag = engineState === "loading" ? t("quickTagLoading") : engineState === "idle" || engineState === "failed" ? t("quickTagIdle") : t("quickTag");
      await botSay(quickAnswer(q, qVec), tagText(tag, hits.map(d => d.id).join(", ") + (qVec ? " (meaning)" : " (words)")));
    } else await aiAnswer(q, qVec);
  }
  busy = false; sendBtn.disabled = false;
  if (engineState === "ready") input.focus();
  afterAnswer(q);
}

async function aiAnswer(q, qVec) {
  const prevUser = history.filter(m => m.role === "user").at(-2)?.content || "";
  const sections = retrieve(q + " " + prevUser, BUDGET.sections, qVec);
  const ctx = sections.map(d => `## ${d.title}\n${d.text}`).join("\n\n");
  const H = LANG === "fr" ? ["Recruteur", "Résumé du profil", "Détails pertinents"] : ["Recruiter", "Profile summary", "Relevant details"];
  const system = `${rules()}\n\n# ${H[0]}\n${leadInfo()}\n\n# ${H[1]}\n${P.core}\n\n# ${H[2]}\n${ctx}`;
  const recent = history.slice(-1 - BUDGET.history, -1).map(m => ({ role: m.role, content: m.content.slice(0, 700) }));
  const messages = [{ role: "system", content: system }, ...recent, { role: "user", content: q }];
  const debugInfo = sections.map(d => d.id).join(", ") + (qVec ? " (meaning)" : " (words)");

  const bubble = addMsg("bot", "");
  bubble.classList.add("cursor");
  let text = "", tag = DEBUG ? debugInfo : "";
  try {
    markBusy("generate", current);
    const stream = await engine.chat.completions.create({ messages, stream: true, temperature: 0.4, top_p: 0.9, max_tokens: BUDGET.maxTokens });
    let cut = false;
    for await (const chunk of stream) {
      text += chunk.choices[0]?.delta?.content || "";
      if (chunk.choices[0]?.finish_reason === "length") cut = true;
      bubble.innerHTML = render(text);
      chat.scrollTop = chat.scrollHeight;
    }
    clearBusy();
    // The hard cap stopped the model mid-sentence: keep only complete sentences.
    if (cut) text = trimToSentence(text);
    store.del(CRASHED_KEY); // a full answer went through: the device can handle it
    // Guard: an answer citing a number, name, email or link that the model was not given is replaced by the
    // profile extract.
    const check = Retrieval.groundCheck(text, [system, ...recent.map(m => m.content), q].join("\n"));
    if (!check.ok) {
      console.warn("Answer rejected by the guard:", check, text);
      text = quickAnswer(q, qVec);
      tag = tagText(t("guardTag"), `${debugInfo} · unknown: ${[...check.unknown, ...check.names].join(", ")}`);
    }
  } catch (e) {
    console.error(e);
    clearBusy();
    text = text || quickAnswer(q, qVec);
    tag = t("aiError");
  }
  bubble.innerHTML = render(text) + (tag ? `<span class="tag">${esc(tag)}</span>` : "");
  bubble.classList.remove("cursor");
  history.push({ role: "assistant", content: text });
}

function afterAnswer(q) {
  if (!contactShown && !ctaShown && (answers >= F.ctaAfterAnswers || F.intent.test(q))) showCta();
  nextStep();
}

form.onsubmit = e => { e.preventDefault(); ask(input.value); };
input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(input.value); } });
function autosize() { input.style.height = "46px"; input.style.height = Math.min(input.scrollHeight + 2, 140) + "px"; }
input.addEventListener("input", autosize);
$("settingsBtn").onclick = openSettings;

// ---------- Start ----------
async function boot() {
  applyTexts();
  const crash = readCrash();
  if (crash) store.set(CRASHED_KEY, "1");
  wz.crash = crash;
  const onboarded = !!store.get("lang") && savedModel() !== null;
  // First visit, or the AI crashed the page: all steps. Otherwise only the position step.
  showWizard(onboarded && !crash ? [3] : [1, 2, 3], "onboard");
  await probe();
  let pref = savedModel();
  if (crash) pref = crash.model !== LIGHTEST && OFFERED.includes(LIGHTEST) && !LOW_MEM ? LIGHTEST : "quick";
  wz.model = !device.gpu ? "quick" : pref ?? RECOMMENDED;
  refreshEngine();
  if (wz.steps[wz.idx] === 1) renderWizard();
  const forced = session.take("loadNow");
  if (device.gpu) await deleteStoredModels();
  // The settings were changed during a download: start the new model right away.
  if (forced && typeof pref === "number" && device.gpu) loadModel(pref);
}
boot();
</script>
</body>
